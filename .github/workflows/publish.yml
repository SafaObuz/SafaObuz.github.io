name: Publish Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ runner.os }}-${{ hashFiles('**/literature.qmd') }}
          restore-keys: r-packages-${{ runner.os }}-

      - name: Install R packages  
        run: |
          R -e 'if (!require("yaml")) install.packages("yaml", repos="https://cloud.r-project.org")'
          R -e 'if (!require("knitr")) install.packages("knitr", repos="https://cloud.r-project.org")'
          R -e 'if (!require("rmarkdown")) install.packages("rmarkdown", repos="https://cloud.r-project.org")'
          
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
